name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install PDF runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            libffi8 \
            libgdk-pixbuf-2.0-0 \
            libglib2.0-0 \
            libharfbuzz0b \
            libharfbuzz-subset0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            shared-mime-info

      - name: Install project and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,release]'

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Unit tests
        run: python -m pytest -q

      - name: Runtime compatibility smoke test
        run: python scripts/smoke_import.py

      - name: Build and validate Python distributions
        run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*
