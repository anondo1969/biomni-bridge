name: Docker check

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - pyproject.toml
      - "src/**"
      - "scripts/smoke_import.py"
      - ".github/workflows/docker-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'workflow_dispatch' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          tags: biomni-bridge-check:${{ github.sha }}
          cache-from: type=gha,scope=biomni-bridge-docker-check
          cache-to: type=gha,mode=min,scope=biomni-bridge-docker-check
          provenance: false
          sbom: false
